<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>
</head>
<body>
    <div class="container">
        <h1>MINI STORE CHECKOUT SYSTEM</h1>
        
        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>
        
        <div class="form-group">
            <label for="productCount">Number of Products</label>
            <input type="number" id="productCount" min="1" value="1" placeholder="Enter number of products">
        </div>
        
        <div id="productsContainer">
            <div class="product-item">
                <label for="productName-0">Product Name</label>
                <input type="text" id="productName-0" placeholder="Product Name"><br>

                <label for="productPrice-0">Price</label>
                <input type="number" id="productPrice-0" step="0.01" min="0" placeholder="Price"><br>

                <label for="productQuantity-0">Quantity</label>
                <input type="number" id="productQuantity-0" min="1" placeholder="Quantity"><br>
            </div>
        </div>
        
        <div class="form-group">
            <label for="deliveryOption">Delivery Option</label>
            <select id="deliveryOption">
                <option value="1">Store Pickup</option>
                <option value="2">Standard Delivery</option>
                <option value="3">Express Delivery</option>
            </select>
        </div>
        
        <button id="calculateBtn">Calculate Order</button>
        
        <div id="validationMessage" style="color: red; margin-top: 10px;"></div>
        <div id="orderSummary" style="white-space: pre-line; margin-top: 15px; font-family: monospace;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
